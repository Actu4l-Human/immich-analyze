# Single-GPU text output; audio and vision inputs remain enabled.
# Values here are literal YAML, not Compose environment substitutions.
pipeline: qwen3_omni_moe_thinker_only
distributed_executor_backend: mp
enable_prefix_caching: true
stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    max_model_len: 16384
    # Leave room for audiovisual activation peaks and desktop GPU use.
    gpu_memory_utilization: 0.8
    enforce_eager: true
    async_scheduling: false
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 1024
      seed: 42
      repetition_penalty: 1.05
